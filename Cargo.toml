[package]
name = "resource-monitor"
version = "1.0.0"
edition = "2021"

[dependencies]
# tray icon, blocking for thread + sleep implementation
ksni = { version = "0.3", features = ["blocking"] }

# CPU temperature & ram usage
sysinfo = { version = "0.33", default-features = false, features = ["system", "component"] }

# NVIDIA GPU temperature via NVML
nvml-wrapper = "0.10"

# drawing the temperature text into the icon bitmap
ab_glyph = "0.2"

serde = { version = "1", features = ["derive"] }
toml = "0.9"

[profile.release]
strip = true      
lto = true         
